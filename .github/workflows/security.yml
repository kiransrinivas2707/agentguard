name: security
on:
  push:
  pull_request:
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m pytest tests/test_security.py tests/test_hardening.py tests/test_resources.py tests/test_runtime.py -q
